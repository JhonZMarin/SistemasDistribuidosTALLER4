<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Pilotos - UB</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/runtime-config.js" defer></script>
  <script src="./js/config.js" defer></script>
  <script src="./js/auth.js" defer></script>
  <script type="module" src="./js/lobby.js" defer></script>
</head>
<body data-page="lobby">
  <main class="page page--lobby" style="display: grid; grid-template-columns: 1fr 350px; gap: 20px;">
    
    <section class="panel">
      <canvas id="gameCanvas" style="border: 1px solid var(--line); border-radius: 12px; background: #000;"></canvas>
    </section>

    <aside style="display: flex; flex-direction: column; gap: 20px;">
      
      <article class="panel" style="border-color: var(--amber);">
        <p class="panel__kicker">Controles de Juego</p>
        <h3 id="game-status">Estado: Lobby</h3>
        
        <div id="lobby-controls" style="margin-top: 15px;">
          <button id="btn-start-game" class="button button--primary" style="width: 100%;">Iniciar Partida</button>
        </div>

        <div id="playing-controls" style="display: none; margin-top: 15px; flex-direction: column; gap: 10px;">
          <p id="role-display" style="font-weight: bold; margin: 0 0 10px 0; color: var(--text); font-size: 1.2rem;"></p>
          <div id="impostor-actions" style="display: none; gap: 10px;">
             <button id="btn-kill" class="button button--accent" style="flex: 1; background: var(--danger); box-shadow: 0 12px 24px rgba(255, 107, 135, 0.22); color: white;">KILL</button>
             <button id="btn-vent" class="button button--ghost" style="flex: 1;">VENT</button>
          </div>
          <div id="crewmate-actions" style="display: none; gap: 10px; flex-direction: column;">
             <button id="btn-task" class="button button--primary" style="width: 100%; display: none;">HACER TAREA</button>
          </div>
          <button id="btn-vitals" class="button button--ghost" style="width: 100%; display: none; margin-top: 10px;">VER VITALES</button>
          <button id="btn-call-meeting" class="button button--accent" style="width: 100%; display: none; margin-top: 10px; background: #e63946; color: white;">🚨 LLAMAR REUNIÓN</button>
        </div>
      </article>

      <!-- Modal de Signos Vitales -->
      <dialog id="vitals-modal" style="border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); padding: 20px; width: 300px;">
        <h3 style="margin-bottom: 15px;">Panel de Signos Vitales</h3>
        <ul id="vitals-list" class="players-list"></ul>
        <button onclick="document.getElementById('vitals-modal').close()" class="button button--ghost" style="width: 100%; margin-top: 15px;">Cerrar</button>
      </dialog>

      <!-- Modal de Votación -->
      <dialog id="voting-modal" style="border: 1px solid var(--danger); border-radius: 12px; background: var(--surface); color: var(--text); padding: 20px; width: 350px;">
        <h3 style="margin-bottom: 5px; color: var(--danger);">🚨 REUNIÓN DE EMERGENCIA</h3>
        <p id="meeting-caller" style="font-size: 0.9rem; color: var(--muted); margin-bottom: 15px;"></p>
        <p id="meeting-timer" style="font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 15px;">Tiempo: 30s</p>
        <ul id="voting-list" class="players-list" style="max-height: 150px; overflow-y: auto;"></ul>
        <button id="btn-vote-skip" class="button button--ghost" style="width: 100%; margin-top: 10px;">Saltar Voto (Skip)</button>
        
        <div id="chat-section" style="margin-top: 15px; border-top: 1px solid var(--line); padding-top: 10px;">
          <h4 style="margin-bottom: 5px; font-size: 0.9rem;">Chat Público</h4>
          <div id="chat-messages" style="height: 100px; overflow-y: auto; background: var(--background); padding: 5px; border-radius: 4px; margin-bottom: 5px; font-size: 0.85rem; word-break: break-word;"></div>
          <div style="display: flex; gap: 5px;">
            <input type="text" id="chat-input" placeholder="Mensaje..." style="flex: 1; padding: 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--text);" maxlength="100">
            <button id="btn-send-chat" class="button button--primary" style="padding: 5px 10px;">Enviar</button>
          </div>
        </div>
      </dialog>

      <article class="panel">
        <header style="display: flex; justify-content: space-between; align-items: center;">
          <h3>Radar</h3>
          <button id="logout-button" class="button button--ghost" style="padding: 5px 10px; min-height: auto;">Salir</button>
        </header>
        <div id="connection-status" class="status-badge status-badge--connecting">Conectando...</div>
        <div style="margin-top: 12px; display: grid; gap: 6px;">
          <div class="panel__kicker" style="font-size: 0.8rem;">Coordinador actual</div>
          <div id="coordinator-id" style="font-family: 'Orbitron', 'Rajdhani', sans-serif; letter-spacing: 0.08em;">Sin asignar</div>
          <div id="coordinator-url" style="color: var(--muted); word-break: break-word;">Esperando asignacion...</div>
        </div>
        <ul id="players-list" class="players-list" style="margin-top: 15px;"></ul>
      </article>

    </aside>
  </main>
</body>
</html>
