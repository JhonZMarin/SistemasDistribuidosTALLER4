<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Pilotos - UB</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/runtime-config.js" defer></script>
  <script src="./js/config.js" defer></script>
  <script src="./js/auth.js" defer></script>
  <script type="module" src="./js/lobby.js" defer></script>
</head>
<body data-page="lobby">
  <main class="page page--lobby" style="display: grid; grid-template-columns: 1fr 350px; gap: 20px;">
    
    <section class="panel">
      <canvas id="gameCanvas" style="border: 1px solid var(--line); border-radius: 12px; background: #000;"></canvas>
    </section>

    <aside style="display: flex; flex-direction: column; gap: 20px;">
      
      <article class="panel" style="border-color: var(--amber);">
        <p class="panel__kicker">Estado del Piloto</p>
        <h3>Actualizar Mood</h3>
        <div class="mood-selector" style="display: flex; gap: 10px; margin-top: 15px; font-size: 1.5rem;">
          <button onclick="updateMood('🚀')" style="cursor:pointer; background:none; border:1px solid var(--line); border-radius:8px;">🚀</button>
          <button onclick="updateMood('👨‍🚀')" style="cursor:pointer; background:none; border:1px solid var(--line); border-radius:8px;">👨‍🚀</button>
          <button onclick="updateMood('🤖')" style="cursor:pointer; background:none; border:1px solid var(--line); border-radius:8px;">🤖</button>
          <button onclick="updateMood('🔥')" style="cursor:pointer; background:none; border:1px solid var(--line); border-radius:8px;">🔥</button>
        </div>
      </article>

      <article class="panel">
        <header style="display: flex; justify-content: space-between; align-items: center;">
          <h3>Radar</h3>
          <button id="logout-button" class="button button--ghost" style="padding: 5px 10px; min-height: auto;">Salir</button>
        </header>
        <div id="connection-status" class="status-badge status-badge--connecting">Conectando...</div>
        <div style="margin-top: 12px; display: grid; gap: 6px;">
          <div class="panel__kicker" style="font-size: 0.8rem;">Coordinador actual</div>
          <div id="coordinator-id" style="font-family: 'Orbitron', 'Rajdhani', sans-serif; letter-spacing: 0.08em;">Sin asignar</div>
          <div id="coordinator-url" style="color: var(--muted); word-break: break-word;">Esperando asignacion...</div>
        </div>
        <ul id="players-list" class="players-list" style="margin-top: 15px;"></ul>
      </article>

    </aside>
  </main>
</body>
</html>
